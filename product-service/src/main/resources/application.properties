spring.application.name=product-service
spring.datasource.url=jdbc:mysql://localhost:3310/product_service
#mvn clean package -DskipTests
#spring.datasource.url=jdbc:mysql://mysql-product:3306/product_service
spring.datasource.username=appuser
spring.datasource.password=apppassword
spring.jpa.hibernate.ddl-auto=update
server.port=8080
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

#redis-cache
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
# Swagger / API Docs
springdoc.swagger-ui.path=/swagger-ui.html
#springdoc.api-docs.path=/api-docs

jwt.secret=MY_SUPER_SECRET_KEY_123456789012345678901234567890

# AWS S3 Configuration
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.region=${AWS_REGION}
aws.s3.bucket-name=microservices-ecommerce-images