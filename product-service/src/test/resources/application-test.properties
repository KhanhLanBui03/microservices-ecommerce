spring.application.name=product-service
spring.datasource.url=jdbc:mysql://localhost:3310/product_service
spring.datasource.username=appuser
spring.datasource.password=apppassword
spring.jpa.hibernate.ddl-auto=update
server.port=0
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true

# Test configuration
# Skip JWT validation in test
spring.security.filter.order=5
# Allow all requests in test
spring.test.context.cache.maxSize=32

jwt.secret=MY_SUPER_SECRET_KEY_123456789012345678901234567890

redis.enabled=false
spring.cache.type=none
